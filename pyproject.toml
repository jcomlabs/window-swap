[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "window-swap"
version = "1.2.0b1"
description = "A local Windows tray utility for cycling through snapped windows that share the same screen region."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JC-OM" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = [
  "pillow>=10,<13",
  "pystray>=0.19,<1",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
window-swap = "window_swapper:main"

[tool.setuptools]
py-modules = ["window_swapper", "window_swap_core", "window_swap_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
