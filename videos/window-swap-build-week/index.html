    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-keep-the-region", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 12);
        tl.fromTo("#el-02-swap-demonstrated", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 12);

        tl.to("#el-03-build-week-extension", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 50);
        tl.fromTo("#el-04-codex-collaboration", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 50);
        tl.to("#el-04-codex-collaboration", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 68);
        tl.fromTo("#el-05-proof", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 68);
        tl.to("#el-05-proof", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 86);
        tl.fromTo("#el-06-download", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 86);
        tl.to({}, { duration: 98 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
