<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          color: #07111f;
          font-family: Arial, sans-serif;
        }

        #root * {
          box-sizing: border-box;
        }

        [class~="f05-proof-ground"] {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #f4f7fb;
        }

        [class~="f05-proof-content"] {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          padding: 58px 96px 0;
          overflow: hidden;
        }

        [class~="f05-proof-header"] {
          position: relative;
          z-index: 5;
          height: 165px;
        }

        [class~="f05-proof-accent-line"] {
          display: block;
          width: 60px;
          height: 4px;
          border-radius: 2px;
          background: #2767cb;
          transform-origin: left center;
        }

        [class~="f05-proof-eyebrow"] {
          margin-top: 18px;
          font-size: 17px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #2767cb;
        }

        [class~="f05-proof-title"] {
          margin: 12px 0 0;
          font-size: 50px;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #07111f;
        }

        [class~="f05-proof-tag"] {
          position: absolute;
          top: 4px;
          right: 0;
          padding: 10px 18px;
          border-radius: 100px;
          background: rgba(39, 103, 203, 0.08);
          font-size: 14px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: 0.05em;
          color: #2767cb;
        }

        [class~="f05-proof-stage"] {
          position: relative;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 24px;
          width: 100%;
          height: 430px;
          will-change: transform;
        }

        [class~="f05-proof-card"] {
          --dof: 0px;
          position: relative;
          z-index: 2;
          min-width: 0;
          height: 430px;
          padding: 30px 28px;
          overflow: hidden;
          border: 1.5px solid rgba(39, 103, 203, 0.2);
          border-radius: 14px;
          background: rgba(39, 103, 203, 0.04);
          filter: blur(var(--dof));
          will-change: transform, opacity, filter;
        }

        [class~="f05-proof-card"]::after {
          content: "";
          position: absolute;
          left: 0;
          bottom: 0;
          width: 100%;
          height: 4px;
          background: #2767cb;
          opacity: 0.35;
        }

        [class~="f05-proof-card-index"] {
          display: grid;
          place-items: center;
          width: 42px;
          height: 42px;
          border: 1.5px solid rgba(39, 103, 203, 0.2);
          border-radius: 50%;
          font-size: 16px;
          line-height: 1;
          font-weight: 700;
          color: #2767cb;
        }

        [class~="f05-proof-card-kicker"] {
          margin-top: 62px;
          font-size: 14px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #2767cb;
        }

        [class~="f05-proof-card-title"] {
          display: flex;
          flex-direction: column;
          margin-top: 16px;
          font-size: 34px;
          line-height: 1.04;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #07111f;
        }

        [class~="f05-proof-card-status"] {
          position: absolute;
          left: 28px;
          bottom: 34px;
          display: flex;
          align-items: center;
          gap: 11px;
          font-size: 14px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: 0.06em;
          color: #864eeb;
        }

        [class~="f05-proof-status-dot"] {
          display: block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #2767cb;
        }

        [class~="f05-proof-hero-card"] {
          display: grid;
          place-items: center;
          padding: 22px;
          transform-origin: 50% 50%;
        }

        [class~="f05-proof-ring-wrap"] {
          position: relative;
          display: grid;
          place-items: center;
          width: 260px;
          height: 260px;
        }

        [class~="f05-proof-ring"] {
          position: absolute;
          inset: 0;
          width: 260px;
          height: 260px;
        }

        [class~="f05-proof-ring-track"] {
          fill: none;
          stroke: rgba(39, 103, 203, 0.08);
          stroke-width: 18;
        }

        [class~="f05-proof-ring-fill"] {
          fill: none;
          stroke: #2767cb;
          stroke-width: 18;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 130px 130px;
        }

        [class~="f05-proof-count"] {
          position: relative;
          z-index: 2;
          display: block;
          width: 190px;
          text-align: center;
          font-size: 126px;
          line-height: 1;
          font-weight: 700;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.05em;
          color: #2767cb;
          transform-origin: 50% 50%;
        }

        [class~="f05-proof-hero-label"] {
          margin-top: 20px;
          text-align: center;
          font-size: 20px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #07111f;
        }

        [class~="f05-proof-payoff-wrap"] {
          position: relative;
          display: grid;
          place-items: center;
          width: 100%;
          height: 150px;
          margin-top: 24px;
        }

        [class~="f05-proof-glow"] {
          position: absolute;
          z-index: 1;
          left: 50%;
          top: 50%;
          width: 920px;
          height: 220px;
          margin-left: -460px;
          margin-top: -110px;
          border-radius: 50%;
          background: radial-gradient(ellipse at center, rgba(39, 103, 203, 0.28) 0%, rgba(39, 103, 203, 0.08) 46%, rgba(39, 103, 203, 0) 76%);
          pointer-events: none;
          will-change: transform, opacity;
        }

        [class~="f05-proof-payoff"] {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          gap: 22px;
          padding: 22px 38px;
          border: 1.5px solid rgba(39, 103, 203, 0.2);
          border-radius: 100px;
          background: #f4f7fb;
          font-size: 36px;
          line-height: 1;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #07111f;
        }

        [class~="f05-proof-payoff-check"] {
          display: grid;
          place-items: center;
          width: 46px;
          height: 46px;
          border-radius: 50%;
          background: #2767cb;
          font-size: 24px;
          line-height: 1;
          color: #f4f7fb;
        }

        [class~="f05-proof-progress-base"] {
          position: absolute;
          left: 0;
          top: 888px;
          width: 100%;
          height: 3px;
          background: rgba(39, 103, 203, 0.08);
        }

        [class~="f05-proof-progress-fill"] {
          display: block;
          width: 100%;
          height: 100%;
          background: #2767cb;
          transform-origin: left center;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-proof"
        data-width="1920"
        data-height="1080"
        data-duration="18.5"
      >
        <div id="f05-proof-ground" class="clip f05-proof-ground" data-start="0" data-duration="18.5" data-track-index="0"></div>

        <div id="f05-proof-content" class="clip f05-proof-content" data-start="0" data-duration="18.5" data-track-index="1">
          <header class="f05-proof-header">
            <span id="f05-proof-accent-line" class="f05-proof-accent-line"></span>
            <div id="f05-proof-eyebrow" class="f05-proof-eyebrow">VERIFIED ENGINEERING</div>
            <h1 id="f05-proof-title" class="f05-proof-title">PROOF, NOT PROMISES</h1>
            <div id="f05-proof-tag" class="f05-proof-tag">PUBLIC EVIDENCE</div>
          </header>

          <section id="f05-proof-stage" class="f05-proof-stage" aria-label="Verified repository evidence">
            <article id="f05-proof-card-tests" class="f05-proof-card f05-proof-hero-card">
              <div class="f05-proof-ring-wrap">
                <svg class="f05-proof-ring" viewBox="0 0 260 260" aria-hidden="true">
                  <circle class="f05-proof-ring-track" cx="130" cy="130" r="108"></circle>
                  <circle id="f05-proof-ring-fill" class="f05-proof-ring-fill" cx="130" cy="130" r="108"></circle>
                </svg>
                <span id="f05-proof-count" class="f05-proof-count">0</span>
              </div>
              <div id="f05-proof-hero-label" class="f05-proof-hero-label">AUTOMATED TESTS</div>
            </article>

            <article id="f05-proof-card-ci" class="f05-proof-card" data-depth="1">
              <div class="f05-proof-card-index">01</div>
              <div class="f05-proof-card-kicker">CONTINUOUS INTEGRATION</div>
              <div class="f05-proof-card-title"><span>CI</span><span>PASSING</span></div>
              <div class="f05-proof-card-status"><span class="f05-proof-status-dot"></span>VERIFIED</div>
            </article>

            <article id="f05-proof-card-release" class="f05-proof-card" data-depth="2">
              <div class="f05-proof-card-index">02</div>
              <div class="f05-proof-card-kicker">REPRODUCIBLE BUILD</div>
              <div class="f05-proof-card-title"><span>WINDOWS</span><span>RELEASE</span></div>
              <div class="f05-proof-card-status"><span class="f05-proof-status-dot"></span>RELEASED</div>
            </article>

            <article id="f05-proof-card-privacy" class="f05-proof-card" data-depth="3">
              <div class="f05-proof-card-index">03</div>
              <div class="f05-proof-card-kicker">PUBLIC REPOSITORY</div>
              <div class="f05-proof-card-title"><span>PRIVACY</span><span>AUDIT</span></div>
              <div class="f05-proof-card-status"><span class="f05-proof-status-dot"></span>AUDITED</div>
            </article>
          </section>

          <div id="f05-proof-payoff-wrap" class="f05-proof-payoff-wrap">
            <div id="f05-proof-glow" class="f05-proof-glow"></div>
            <div id="f05-proof-payoff" class="f05-proof-payoff">
              <span class="f05-proof-payoff-check">✓</span>
              <span>PUBLIC + REPRODUCIBLE</span>
            </div>
          </div>
        </div>

        <div id="f05-proof-progress" class="clip f05-proof-progress-base" data-start="0" data-duration="18.5" data-track-index="2">
          <span id="f05-proof-progress-fill" class="f05-proof-progress-fill"></span>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const ring = document.getElementById("f05-proof-ring-fill");
        const ringLength = ring.getTotalLength();
        ring.style.strokeDasharray = String(ringLength);
        ring.style.strokeDashoffset = String(ringLength);

        const countState = { value: 0 };
        const count = document.getElementById("f05-proof-count");

        tl.fromTo(
          "[id=\"f05-proof-accent-line\"]",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          0.04
        );
        tl.fromTo(
          "[id=\"f05-proof-eyebrow\"]",
          { x: -22, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          0.12
        );
        tl.fromTo(
          "[id=\"f05-proof-title\"]",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.68, ease: "power3.out" },
          0.2
        );
        tl.fromTo(
          "[id=\"f05-proof-tag\"]",
          { x: 20, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          0.28
        );

        tl.fromTo(
          "[id=\"f05-proof-card-tests\"]",
          { x: 660, y: 4, scale: 1.16, opacity: 0.7 },
          { x: 660, y: 4, scale: 1.16, opacity: 1, duration: 0.46, ease: "power2.out" },
          0.02
        );
        tl.to(
          countState,
          {
            value: 15,
            duration: 2.65,
            ease: "power3.out",
            onUpdate: () => {
              count.textContent = String(Math.round(countState.value));
            }
          },
          0.3
        );
        tl.fromTo(
          "[id=\"f05-proof-count\"]",
          { scale: 0.5 },
          { scale: 1, duration: 2.65, ease: "power3.out" },
          0.3
        );
        tl.to(
          ring,
          { strokeDashoffset: 0, duration: 2.65, ease: "power3.out" },
          0.3
        );
        tl.fromTo(
          "[id=\"f05-proof-hero-label\"]",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.62, ease: "power2.out" },
          0.82
        );

        tl.to(
          "[id=\"f05-proof-card-tests\"]",
          { x: 0, y: 0, scale: 1, duration: 1.15, ease: "power2.inOut" },
          4.25
        );
        tl.to(
          "[id=\"f05-proof-stage\"]",
          { x: 24, duration: 1.0, ease: "power2.inOut" },
          4.95
        );
        tl.fromTo(
          "[id=\"f05-proof-card-ci\"]",
          { x: 74, scale: 0.96, opacity: 0, "--dof": "8px" },
          { x: 0, scale: 1, opacity: 1, "--dof": "0px", duration: 0.95, ease: "power3.out" },
          5.18
        );
        tl.to(
          "[id=\"f05-proof-card-tests\"]",
          { "--dof": "7px", opacity: 0.58, duration: 0.75, ease: "power2.inOut" },
          5.18
        );

        tl.to(
          "[id=\"f05-proof-stage\"]",
          { x: -10, duration: 1.05, ease: "power2.inOut" },
          7.78
        );
        tl.fromTo(
          "[id=\"f05-proof-card-release\"]",
          { x: 74, scale: 0.96, opacity: 0, "--dof": "8px" },
          { x: 0, scale: 1, opacity: 1, "--dof": "0px", duration: 0.95, ease: "power3.out" },
          8.02
        );
        tl.to(
          "[id=\"f05-proof-card-ci\"]",
          { "--dof": "7px", opacity: 0.58, duration: 0.75, ease: "power2.inOut" },
          8.02
        );

        tl.to(
          "[id=\"f05-proof-stage\"]",
          { x: -34, duration: 1.05, ease: "power2.inOut" },
          10.62
        );
        tl.fromTo(
          "[id=\"f05-proof-card-privacy\"]",
          { x: 74, scale: 0.96, opacity: 0, "--dof": "8px" },
          { x: 0, scale: 1, opacity: 1, "--dof": "0px", duration: 0.95, ease: "power3.out" },
          10.86
        );
        tl.to(
          "[id=\"f05-proof-card-release\"]",
          { "--dof": "7px", opacity: 0.58, duration: 0.75, ease: "power2.inOut" },
          10.86
        );

        tl.to(
          "[id=\"f05-proof-stage\"]",
          { x: 0, duration: 0.9, ease: "power2.inOut" },
          13.45
        );
        ["tests", "ci", "release", "privacy"].forEach((name) => {
          tl.to(
            `[id=\"f05-proof-card-${name}\"]`,
            { "--dof": "0px", opacity: 1, duration: 0.9, ease: "power2.inOut" },
            13.45
          );
        });
        tl.fromTo(
          "[id=\"f05-proof-payoff\"]",
          { y: 18, scale: 0.97, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.82, ease: "power3.out" },
          13.72
        );
        tl.fromTo(
          "[id=\"f05-proof-glow\"]",
          { opacity: 0, scale: 0.86 },
          { opacity: 0.24, scale: 1, duration: 1.12, ease: "power2.out" },
          13.45
        );
        tl.to(
          "[id=\"f05-proof-glow\"]",
          { opacity: 0.18, scale: 0.98, duration: 0.7, ease: "power2.inOut" },
          14.57
        );

        tl.fromTo(
          "[id=\"f05-proof-progress-fill\"]",
          { scaleX: 0.68 },
          { scaleX: 0.85, duration: 18, ease: "none" },
          0
        );

        window.__timelines["05-proof"] = tl;
      </script>
    </template>
  </body>
</html>
