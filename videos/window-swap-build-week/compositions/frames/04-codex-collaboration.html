      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const railPath = document.querySelector('[id="f04-codex-collaboration-rail-path"]');
        const railLength = railPath.getTotalLength();
        railPath.style.strokeDasharray = `${railLength}`;
        railPath.style.strokeDashoffset = `${railLength}`;

        tl.fromTo(
          '[id="f04-codex-collaboration-accent-line"]',
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          0.04
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-eyebrow"]',
          { x: -24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          0.12
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-tag"]',
          { x: 24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          0.28
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-human"]',
          { x: -58, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.86, ease: "power3.out" },
          0.2
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-execution"]',
          { x: 58, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
          0.38
        );

        tl.fromTo(
          '[id="f04-codex-collaboration-rail-path"]',
          { strokeDashoffset: railLength },
          { strokeDashoffset: 0, duration: 9.65, ease: "power2.out" },
          4.1
        );

        const itemEntrances = [
          ['[id="f04-codex-collaboration-item-privacy"]', 4.05],
          ['[id="f04-codex-collaboration-item-audit"]', 6.05],
          ['[id="f04-codex-collaboration-item-implement"]', 8.15],
          ['[id="f04-codex-collaboration-item-test"]', 10.35],
          ['[id="f04-codex-collaboration-item-release"]', 12.45]
        ];

        itemEntrances.forEach(([selector, at]) => {
          tl.fromTo(
            selector,
            { x: 42, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
            at
          );
          tl.fromTo(
            selector + ' [class~="f04-codex-collaboration-node"]',
            { scale: 0.72, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
            at + 0.12
          );
        });

        const keywordTimings = {
          privacy: { start: 4.25, end: 5.2 },
          audit: { start: 6.25, end: 7.05 },
          implement: { start: 8.35, end: 9.2 },
          test: { start: 10.55, end: 11.45 },
          release: { start: 12.65, end: 13.7 }
        };
        const keywordDriver = { t: 0 };
        const keywords = document.querySelectorAll('[class~="f04-codex-collaboration-keyword"]');
        const attackDuration = 0.18;
        const releaseDuration = 0.36;
        const restLevel = 0.16;

        function keywordEnvelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / attackDuration, 1);
          if (time < end + releaseDuration) {
            const decay = (time - end) / releaseDuration;
            return 1 - decay * (1 - restLevel);
          }
          return restLevel;
        }

        tl.to(
          keywordDriver,
          {
            t: 18,
            duration: 18,
            ease: "none",
            onUpdate: () => {
              keywords.forEach((keyword) => {
                const timing = keywordTimings[keyword.dataset.word];
                const envelope = keywordEnvelope(keywordDriver.t, timing.start, timing.end);
                const blur = 18 * envelope;
                const scale = 1 + 0.05 * envelope;
                const alpha = 0.08 + 0.34 * envelope;
                keyword.style.textShadow = `0 0 ${blur}px rgba(39, 103, 203, ${alpha})`;
                keyword.style.transform = `scale(${scale})`;
              });
            }
          },
          0
        );

        tl.fromTo(
          '[id="f04-codex-collaboration-resolution"]',
          { y: 28, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.88, ease: "power3.out" },
          14.5
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-resolution"] [class~="f04-codex-collaboration-resolution-steps"] span',
          { x: 22, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, stagger: 0.11, ease: "power3.out" },
          14.68
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-resolution"] [class~="f04-codex-collaboration-verification"]',
          { x: 24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.66, ease: "power3.out" },
          15.1
        );
        tl.fromTo(
          '[id="f04-codex-collaboration-progress-fill"]',
          { scaleX: 0.51 },
          { scaleX: 0.68, duration: 18, ease: "none" },
          0
        );

        window.__timelines["04-codex-collaboration"] = tl;
      </script>
