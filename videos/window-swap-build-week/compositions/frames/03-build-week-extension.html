      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "[id=\"f03-build-week-extension-accent-line\"]",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          0.05

        tl.fromTo(
          "[id=\"f03-build-week-extension-eyebrow\"]",
          { x: -26, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          0.18
        );
        tl.fromTo(
          "[id=\"f03-build-week-extension-title\"]",
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
          0.32
        );

          "[id=\"f03-build-week-extension-tag\"]",
          { x: 24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
          0.52

        tl.fromTo(
          "[id=\"f03-build-week-extension-rail-fill\"]",
          { scaleX: 0 },
          { scaleX: 1, duration: 2.7, ease: "power2.out" },
          0.85
        );
        tl.fromTo(
          '[class~="f03-build-week-extension-rail-stop"]',
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, stagger: 0.42, ease: "power3.out" },
          0.95
        );

        const cardEntrances = [
          ["[id=\"f03-build-week-extension-card-coordinates\"]", { x: 52, y: 36 }, 4.05],
          ["[id=\"f03-build-week-extension-card-instance\"]", { x: -52, y: 36 }, 6.65],
          ["[id=\"f03-build-week-extension-card-diagnostics\"]", { x: 52, y: -36 }, 9.35],
          ["[id=\"f03-build-week-extension-card-release\"]", { x: -52, y: -36 }, 12.05]
        ];

        cardEntrances.forEach(([selector, offset, at]) => {
          tl.fromTo(
            selector,
            { x: offset.x, y: offset.y, scale: 0.94, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: 1.15, ease: "power3.out" },
            at
          );
          tl.fromTo(
            selector + ' [class~="f03-build-week-extension-icon"]',
            { scale: 0.72, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
            at + 0.16
          );
          tl.fromTo(
            selector + ' [class~="f03-build-week-extension-card-copy"]',
            { x: 18, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
            at + 0.22
          );
          tl.fromTo(
            selector + ' [class~="f03-build-week-extension-check"]',
            { scale: 0.74, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.56, ease: "power3.out" },
            at + 0.34
          );
        });

        tl.fromTo(
          "[id=\"f03-build-week-extension-payoff-rule\"]",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          14.55
        );
        tl.fromTo(
          "[id=\"f03-build-week-extension-payoff\"]",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
          14.68
        );
        tl.fromTo(
          "[id=\"f03-build-week-extension-progress-fill\"]",
          { scaleX: 0.34 },
          { scaleX: 0.51, duration: 18, ease: "none" },
          0
        );

        window.__timelines["03-build-week-extension"] = tl;
      </script>
